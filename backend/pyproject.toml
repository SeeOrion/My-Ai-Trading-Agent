[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-trading-agent"
version = "0.1.0"
description = "A domain-driven, research-first quantitative trading agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SeeOrion" }]
dependencies = [
  "exchange-calendars>=4.11,<5",
]

[project.optional-dependencies]
futu = ["futu-api>=9,<10"]
tushare = ["tushare>=1.4,<2"]
free-data = [
  "akshare>=1.18,<2",
]
api = [
  "fastapi>=0.115,<1",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.30,<1",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]
news = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.28,<1",
]
database = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "greenlet>=3.1,<4",
    "sqlalchemy>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trading_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
